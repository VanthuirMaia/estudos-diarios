<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <script>

        var nota = prompt('Digite sua nota')
        var media = 7

        if (nota > media) {
            document.write('Aprovado')

        } else if (nota == 7) {
            document.write('Recuperação')

        } else {
            document.write('Reprovado')
        }

    </script>
</head>
